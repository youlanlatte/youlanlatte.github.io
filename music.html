<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐 · 幽兰拿铁</title>
  <link rel="stylesheet" href="music-assets/music-base.css">
  <link rel="stylesheet" href="music-assets/layout-utilities.css">
  <link rel="stylesheet" href="music-assets/player.css?v=8">
  <link rel="stylesheet" href="css/lens.css">
  <link rel="stylesheet" href="assets/ui/glass.css">
  <script defer src="assets/ui/glass.js"></script>
<link rel="stylesheet" href="music-assets/lyric-view.css">
<link rel="stylesheet" href="music-assets/library-layout.css?v=2">
  <script defer src="js/languages.js"></script>
</head>
<body class="music-view">
  <a class="skip-link" href="#content">跳到音乐播放器</a>
  <div class="container flex justify-content">
    <aside class="sidebar" id="library-nav">
      <div class="sideHeader">
        <div class="logoContainer flex">
          <img src="music-assets/icons/logo.svg" class="logo" alt="Apple Music">
          <span class="close-slot" data-glass-ui="close-menu"></span>
        </div>
        <div class="searchbar flex" data-glass-ui="music-search"></div>
        <nav class="options">
          <a href="index.html" class="option flex align-items"><img src="music-assets/icons/home.svg" alt="">博客首页</a>
          <a href="#songs" class="option flex align-items"><img src="music-assets/icons/browse.svg" alt="">歌曲资料库</a>
        </nav>
        <small class="sidebar-credit">Apple Music Clone · Aditya Bagri</small>
      </div>
    </aside>
    <main class="main" id="content" tabindex="-1">
      <header class="header flex">
        <div class="transport">
          
          <button class="dock-key" data-action="shuffle" aria-label="随机播放" aria-pressed="false">⤨</button>
          <button class="dock-key" data-action="previous" aria-label="上一首">◀◀</button>
          <span data-glass-ui="play"></span>
          <button class="dock-key" data-action="next" aria-label="下一首">▶▶</button>
          <button class="dock-key" data-action="repeat" aria-label="单曲循环" aria-pressed="false">↻</button>
        </div>
        <div class="current">
          <button class="expand-art" aria-label="展开全屏播放器"><img class="mini-art" src="music-assets/covers/haruhikage.jpg" width="40" height="40" alt=""></button>
          <strong>春日影</strong><small>MyGO!!!!!</small>
          <div data-glass-ui="seek"></div>
        </div>
        <div class="level">
          <button class="dock-key" data-action="lyrics" aria-label="显示歌词" aria-pressed="true">♬</button>
          <button class="dock-key" data-action="mute" aria-label="静音" aria-pressed="false">◖))</button>
          <div data-glass-ui="volume"></div>
        </div>

      </header>
      <div class="music-columns"><section class="page" id="songs">
        <div class="library-heading"><span class="menu-slot" data-glass-ui="open-menu"></span><h1 class="playlists">音乐主页</h1><select class="language-picker" aria-label="语言 / Language / 言語"><option value="zh-CN">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
        <h2>歌曲资料库</h2>
        <div class="cardContainer flex">
          <div id="song" data-track="haruhikage" data-title="春日影" data-artist="MyGO!!!!!" data-glass-ui="song"></div>
          <div data-track="killkiss" data-title="KiLLKiSS" data-artist="Ave Mujica" data-glass-ui="song"></div>
        </div>
        <section class="recent-list" hidden><h2>最近播放</h2><div></div></section>
        <p id="no-results" hidden>没有找到匹配的歌曲。试试歌名或艺人名。</p>
        <p id="status" role="status"></p>
        <audio id="audio" class="basic-player" controls preload="metadata" aria-label="春日影 · MyGO!!!!!" src="music-assets/audio/haruhikage.mp3"></audio>
        <a class="direct-play" href="music-assets/audio/haruhikage.mp3">直接打开当前音频 ↗</a>
      </section>
      <aside class="lyrics-panel"><h2>歌词</h2><div id="lyrics" class="timed-viewport" tabindex="0" aria-label="同步歌词">加载歌词…</div></aside></div>
    </main>
  </div>

  
<dialog id="full-player" aria-label="全屏音乐播放器"><button class="emergency-close" aria-label="收起播放器">×</button></dialog>
  <script src="music-assets/lyric-view.js?v=2"></script>
  <script src="music-assets/player.js?v=12"></script>
</body>
</html>

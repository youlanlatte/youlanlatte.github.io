<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐 · 幽兰拿铁</title>
  <link rel="stylesheet" href="music-assets/style.css">
  <link rel="stylesheet" href="music-assets/utility.css">
  <link rel="stylesheet" href="music-assets/player.css?v=8">
  <link rel="stylesheet" href="css/lens.css">
  <link rel="stylesheet" href="assets/ui/glass.css">
  <script defer src="assets/ui/glass.js"></script>
<link rel="stylesheet" href="music-assets/lyric-view.css">
</head>
<body class="music-view">
  <div class="container flex justify-content">
    <aside class="sidebar" id="library-nav">
      <div class="sideHeader">
        <div class="logoContainer flex">
          <img src="music-assets/icons/logo.svg" class="logo" alt="Apple Music">
          <span class="close-slot" data-glass-ui="close-menu"></span>
        </div>
        <div class="searchbar flex" data-glass-ui="music-search"></div>
        <nav class="options">
          <a href="index.html" class="option flex align-items"><img src="music-assets/icons/home.svg" alt="">博客首页</a>
          <a href="#songs" class="option flex align-items"><img src="music-assets/icons/browse.svg" alt="">歌曲资料库</a>
        </nav>
      </div>
    </aside>
    <main class="main">
      <header class="header flex">
        <div class="transport">
          <span class="menu-slot" data-glass-ui="open-menu"></span>
          <span data-glass-ui="play"></span>
        </div>
        <div class="current">
          <button class="expand-art" aria-label="展开全屏播放器"><img class="mini-art" src="music-assets/haruhikage.jpg" width="40" height="40" alt=""></button>
          <strong>春日影</strong><small>MyGO!!!!!</small>
          <div data-glass-ui="seek"></div>
        </div>
        <div class="level">
          <span>音量</span>
          <div data-glass-ui="volume"></div>
        </div>
        <audio id="audio" hidden preload="metadata" aria-label="春日影 · MyGO!!!!!" src="music-assets/audio/haruhikage.mp3"></audio>
      </header>
      <div class="music-columns"><section class="page" id="songs">
        <h1 class="playlists">歌曲资料库</h1>
        <div class="cardContainer flex">
          <div id="song" data-track="haruhikage" data-title="春日影" data-artist="MyGO!!!!!" data-glass-ui="song"></div>
          <div data-track="killkiss" data-title="KiLLKiSS" data-artist="Ave Mujica" data-glass-ui="song"></div>
        </div>
        <p id="no-results" hidden>没有找到匹配的歌曲。试试歌名或艺人名。</p>
        <p id="status" role="status"></p>
        <a class="direct-play" href="music-assets/audio/haruhikage.mp3">直接打开当前音频 ↗</a>
      </section>
      <aside class="lyrics-panel"><h2>歌词</h2><div id="lyrics" class="timed-viewport" tabindex="0" aria-label="同步歌词">加载歌词…</div></aside></div>
    </main>
  </div>
  <footer class="footer">Apple Music Clone · Aditya Bagri</footer>
  
<dialog id="full-player" aria-label="全屏音乐播放器"></dialog>
  <script src="music-assets/lyric-view.js"></script>
  <script src="music-assets/player.js?v=10"></script>
</body>
</html>

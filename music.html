<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐 · 幽兰拿铁</title>
  <link rel="stylesheet" href="music-assets/style.css">
  <link rel="stylesheet" href="music-assets/utility.css">
  <link rel="stylesheet" href="music-assets/player.css">
  <link rel="stylesheet" href="css/lens.css">
  <link rel="stylesheet" href="assets/ui/glass.css">
  <script defer src="assets/ui/glass.js"></script>
</head>
<body class="music-view">
  <div class="container flex justify-content">
    <aside class="sidebar" id="library-nav">
      <div class="sideHeader">
        <div class="logoContainer flex">
          <img src="music-assets/icons/logo.svg" class="logo" alt="Apple Music">
          <button type="button" class="close" aria-label="关闭导航">×</button>
        </div>
        <div class="searchbar flex" data-glass-ui="music-search"></div>
        <nav class="options">
          <a href="index.html" class="option flex align-items"><img src="music-assets/icons/home.svg" alt="">博客首页</a>
          <a href="#songs" class="option flex align-items"><img src="music-assets/icons/browse.svg" alt="">歌曲资料库</a>
        </nav>
      </div>
    </aside>
    <main class="main">
      <header class="header flex">
        <div class="transport">
          <button type="button" class="menu-toggle" aria-label="打开导航" aria-controls="library-nav" aria-expanded="false"><img src="music-assets/icons/hamburger.svg" alt=""></button>
          <span data-glass-ui="play"></span>
        </div>
        <div class="current">
          <strong>春日影</strong><small>MyGO!!!!!</small>
          <div data-glass-ui="seek"></div>
        </div>
        <div class="level">
          <span>音量</span>
          <div data-glass-ui="volume"></div>
        </div>
        <audio id="audio" hidden preload="metadata" aria-label="春日影 · MyGO!!!!!" >
          <source src="music-assets/haruhikage.m4a" type="audio/mp4">
          <source src="music-assets/haruhikage.mp3" type="audio/mpeg">
        </audio>
      </header>
      <section class="page" id="songs">
        <h1 class="playlists">歌曲</h1>
        <div class="cardContainer flex">
          <button class="card" id="song" aria-label="播放春日影">
            <span class="art"><img src="music-assets/icons/trackIcon.svg" alt=""></span>
            <span class="cardTitle">春日影</span>
            <span class="cardDesc">MyGO!!!!!</span>
          </button>
        </div>
        <p id="no-results" hidden>没有匹配的歌曲</p>
        <p id="status" role="status"></p>
        <a class="direct-play" href="music-assets/haruhikage.mp3">用浏览器直接播放 ↗</a>
      </section>
    </main>
  </div>
  <footer class="footer">Apple Music Clone · Aditya Bagri</footer>
  <script src="music-assets/player.js?v=3"></script>
</body>
</html>
